# Shared experiment settings (same on every machine). Values from docs/IRE_Final_Project_Plan.pdf.
# Per-machine settings (corpus.mode, corpus size, models, batch sizes) live in configs/env_<IRE_ENV>.yaml
# and are merged on top of this file by ire.config.load_config().

seed: 13

questions:
  n_target: 200
  n_clean: 200
  folds: [A, B]

dev_subset:                # scripts/prepare_data.py --dev-subset (IMPLEMENTATION_PLAN.md section 0)
  n_questions: 1000        # the 400 placeholder questions + 600 more (seed 13)
  n_passages: 50000        # their gold passages + seeded random others

retrievers: [bm25, dense, splade, rrf]
top_k_cache: 150           # raw top-150 (doc_id, score) cached per (retriever, qid)
pool_size: 50              # masked candidate pool the filters read
final_k: 5                 # first 5 unflagged passages go to the LLM
rrf_k: 60                  # RRF score = sum 1 / (rrf_k + rank)

attacks: [fact, hijack, url, diverse, repeat, stealth, heldout]
poison_rates: [1, 3, 5]

generation:
  temperature: 0.0         # greedy
  max_new_tokens: 32

cluster:                   # plan section 4.2
  top_n: 20
  k: 2
  tau_c: 0.85              # anchor
  tau_c_sweep: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  rouge_l_min: 0.25

perplexity:                # plan section 4.3
  alpha: 0.025             # anchor
  alpha_sweep: [0.01, 0.025, 0.05, 0.10]
  n_calibration: 1000      # random clean corpus passages used for the percentile thresholds
  min_tokens: 20           # shorter passages are not flagged (recorded as too_short)
  rule: either             # pd | pm | either (default: flag if either rule fires)

# Ada profile (run by Arya and Vansh). Selected with IRE_ENV=ada.
# Real models and the full or ~500k corpus, as in docs/IRE_Final_Project_Plan.pdf.
name: ada
# seed and other shared settings: configs/experiment.yaml. This file holds only what differs per machine.

corpus:
  mode: full               # full (~2.7M BEIR NQ) | subset (~500k: all gold + hard negatives; needs steps 3-5)
                           # | random (gold + seeded random fill); decided after the pilot
  n_passages: null         # null = all passages for mode=full
n_dev_questions: 1000

models:
  dense: intfloat/e5-base-v2                        # E5 family; confirm before job A3
  splade: naver/splade-cocondenser-ensembledistil
  llm: Qwen/Qwen2.5-3B-Instruct                     # fixed 3-4B instruct model; confirm before job A7
  perplexity: openai-community/gpt2                 # GPT-2 small

compute:
  device: cuda
  fp16: true
  encode_batch_size: 512
  generate_batch_size: 32
  dense_index: hnsw        # HNSW or IVF-flat on the full corpus; parameters set in step 4

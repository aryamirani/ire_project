# Local profile (Samarth's machine: Windows, RTX 3050 6 GB, 16 GB RAM).
# Selected with IRE_ENV=local. Local numbers are for correctness only, never for results.
# Every report produced under this profile is labelled env=local.
name: local
# seed and other shared settings: configs/experiment.yaml. This file holds only what differs per machine.

corpus:
  mode: random             # all gold passages of the 400 placeholder questions + seeded random others
  n_passages: 5000         # total passages in the local corpus (seed 13)
n_dev_questions: 400       # the 200 target + 200 clean placeholder questions (was 100 before step 2)

models:
  dense: intfloat/e5-small-v2                       # small stand-in from the E5 family
  splade: naver/splade-cocondenser-ensembledistil
  llm: Qwen/Qwen2.5-1.5B-Instruct                   # stand-in behind the same generate() interface
  perplexity: openai-community/gpt2                 # GPT-2 small

compute:
  device: cuda             # falls back to cpu if CUDA is unavailable
  fp16: true
  encode_batch_size: 64     # halved automatically on CUDA out-of-memory
  max_vram_gb: 5.0          # hard cap for this process (RTX 3050 has 6 GB)
  generate_batch_size: 4
  dense_index: flat         # FAISS IndexFlatIP (exact) on the tiny corpus

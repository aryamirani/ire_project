# Every file location used by the code. Never hard-code paths elsewhere.
# ${VAR} is replaced by that environment variable (loaded from .env); an unset variable is an error.
# A path without a variable is relative to the repo root (only for small files that belong in git).
# Forward slashes work on Windows and Linux.

# ---- big data: always under IRE_DATA_DIR, never in git ----
data_dir: ${IRE_DATA_DIR}
raw_dir: ${IRE_DATA_DIR}/raw                          # downloaded BEIR NQ and nq_open
corpus: ${IRE_DATA_DIR}/data/corpus.jsonl
questions_all: ${IRE_DATA_DIR}/data/questions_all.jsonl
questions: ${IRE_DATA_DIR}/data/questions.jsonl
poison_dir: ${IRE_DATA_DIR}/data/poison                # Arya's poison_*.jsonl shards
indexes_dir: ${IRE_DATA_DIR}/indexes                   # bm25/, dense/, splade/
vectors_dir: ${IRE_DATA_DIR}/vectors                   # dense passage vectors + doc_ids
cache_dir: ${IRE_DATA_DIR}/caches                      # top150_<retriever>.jsonl
generation_cache: ${IRE_DATA_DIR}/caches/generation.sqlite
perplexity_cache: ${IRE_DATA_DIR}/caches/perplexity.sqlite
logs_dir: ${IRE_DATA_DIR}/logs
reports_dir: ${IRE_DATA_DIR}/reports                   # JSON reports written by jobs

# ---- small files kept in the repo ----
reports_repo: reports                                  # Ada reports committed by teammates
perplexity_thresholds: configs/perplexity_thresholds.json
heldout_dir: heldout
